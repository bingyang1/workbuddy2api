version: "3.8"

services:
  # ========== 数据库：MySQL 8 ==========
  mysql:
    image: mysql:8.0
    container_name: workbuddy_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"  # 映射到宿主机，方便外部工具访问；不需要可删掉
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Admin_R00T}      # 与原配置 root 密码一致
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workbuddy_admin}       # 启动时自动创建该数据库，无需手动建库
      TZ: Asia/Shanghai
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql  # 数据持久化到本地目录，删除容器不丢数据

  # ========== 缓存：Redis ==========
  redis:
    image: redis:7-alpine
    container_name: workbuddy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"  # 映射到宿主机；不需要可删掉
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/redis:/data  # 数据持久化

  # ========== 核心转换器 ==========
  workbuddy2api:
    build: .
    container_name: workbuddy2api
    image: workbuddy2api-workbuddy2api:latest
    ports:
      - "8787:8787"
    volumes:
      - ./:/app
      # 挂载宿主机的 CodeBuddy 登录凭据（macOS 示例，请按你的系统修改路径）
      - ~/.local/share/CodeBuddyExtension/Data/Public/auth:/data/auth:ro
    environment:
      - CODEBUDDY2OPENAI_KEY=${CODEBUDDY2OPENAI_KEY:-This-is-codebuddy2api-key}
      - CODEBUDDY_AUTH_DIR=/data/auth
    # - WORKBUDDY_DESKTOP_VERSION=5.7.7
    # - WORKBUDDY_CLI_VERSION=2.156.0
      - TZ=Asia/Shanghai
    command: ["python3 converter.py","--host 0.0.0.0","--port 8787","--skip-check","--desensitize"]
    restart: unless-stopped

  # ========== 管理后台（多账号反代 + API Key 网关） ==========
  admin:
    build: .
    container_name: workbuddy_admin
    image: workbuddy2api-admin:latest
    ports:
      - "8790:8790"
    volumes:
      - ./:/app
    environment:
      - ADMIN_PORT=8790
      # 数据库地址改为容器内服务名 mysql，不再走宿主机 127.0.0.1
      - ADMIN_DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-Admin_R00T}@workbuddy_mysql:3306/${MYSQL_DATABASE:-workbuddy_admin}?charset=utf8mb4
      # Redis 地址改为容器内服务名 redis
      - ADMIN_REDIS_URL=redis://workbuddy_redis:6379/0
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-123456}
    # - WORKBUDDY_DESKTOP_VERSION=5.7.7
    # - WORKBUDDY_CLI_VERSION=2.156.0
      - TZ=Asia/Shanghai
    command: ["python3 -m uvicorn admin.server:app","--host 0.0.0.0","--port 8790"]
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
